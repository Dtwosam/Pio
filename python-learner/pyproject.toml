[project]
name = "pio-meteora-learner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
pio = "meteora_learner.cli:main"
pio-market-research = "meteora_learner.pool_market_research_cli:main"
pio-mint-feature-research = "meteora_learner.pool_lp_mint_research_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
