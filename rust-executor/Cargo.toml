[package]
name = "meteora-executor"
version = "0.3.0"
edition = "2021"

[features]
default = []
live-submit = []

[dependencies]
base64 = "0.22"
anyhow = "1"
anchor-client = { version = "0.31.0", features = ["async"] }
anchor-lang = "0.31.0"
bincode = "1.3.3"
commons = { git = "https://github.com/MeteoraAg/dlmm-sdk.git", rev = "576919e3e4368e542c402f000b4264724f7f23ec", package = "commons" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
solana-client = "2"
solana-sdk = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
bs58 = "0.5"
solana-transaction-status-client-types = "=2.3.13"
