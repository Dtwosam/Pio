[package]
name = "meteora-executor"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
anchor-client = { version = "0.31.0", features = ["async"] }
commons = { git = "https://github.com/MeteoraAg/dlmm-sdk.git", rev = "576919e3e4368e542c402f000b4264724f7f23ec", package = "commons" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
